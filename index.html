<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>派遣人員勤務管理系統</title>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
(async () => {
  const token = localStorage.getItem('dispatch_token');
  if (!token) { window.location.href = 'login.html'; return; }
  const r = await fetch(CONFIG.GAS_WEB_APP_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({action:'verifyToken', token, payload:{}})
  }).then(r=>r.json()).catch(()=>({success:false}));
  if (!r.success) { window.location.href = 'login.html'; return; }
  const home = {admin:'admin-dashboard.html', staff:'staff-dashboard.html', client:'client-dashboard.html'};
  window.location.href = home[r.user.role] || 'login.html';
})();
</script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;background:#f5f7fa">
<p style="color:#666">載入中...</p>
</body>
</html>
