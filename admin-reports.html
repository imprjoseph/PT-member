<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>統計報表</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><img src="impr-logo.png" alt="imPR" style="height:36px"><div class="sidebar-brand">imPR 派遣系統<small>管理者後台</small></div></div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">管理功能</div>
    <a class="nav-item" href="admin-dashboard.html"><span class="nav-icon">📊</span>總覽</a>
    <a class="nav-item" href="admin-users.html"><span class="nav-icon">👥</span>帳號管理</a>
    <a class="nav-item" href="admin-attendance.html"><span class="nav-icon">⏱</span>出勤管理</a>
    <a class="nav-item" href="admin-overtime.html"><span class="nav-icon">⏰</span>加班審核</a>
    <a class="nav-item" href="admin-leave.html"><span class="nav-icon">🌿</span>請假審核</a>
    <a class="nav-item active" href="admin-reports.html"><span class="nav-icon">📈</span>統計報表</a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user"><div class="user-avatar" id="sidebarAvatar">A</div><div class="user-info"><div class="user-name" id="sidebarName">管理者</div><div class="user-role">Admin</div></div></div>
    <button onclick="doLogout()" style="width:100%;margin-top:8px;padding:9px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:transparent;color:rgba(255,255,255,.6);font-size:.85rem;cursor:pointer">登出</button>
  </div>
</aside>
<header class="topnav">
  <button class="topnav-menu" onclick="openSidebar()">☰</button>
  <span class="topnav-title">📈 統計報表</span>
</header>
<main class="main-content">

  <!-- 月份選擇 -->
  <div class="filter-bar">
    <input class="form-input dark" type="month" id="filterMonth" style="flex:1">
    <button class="btn btn-primary btn-sm" onclick="loadStats()" style="width:auto;padding:0 20px">載入統計</button>
  </div>

  <!-- 統計數字 -->
  <div class="stat-grid">
    <div class="stat-card" style="border-left-color:var(--success)">
      <div class="stat-label">出勤總人次</div>
      <div class="stat-value" id="sAtt">—</div>
    </div>
    <div class="stat-card" style="border-left-color:var(--danger)">
      <div class="stat-label">加班核准時數</div>
      <div class="stat-value" id="sOT">—</div>
      <div class="stat-sub">小時</div>
    </div>
    <div class="stat-card" style="border-left-color:var(--purple)">
      <div class="stat-label">請假核准時數</div>
      <div class="stat-value" id="sLeave">—</div>
      <div class="stat-sub">小時</div>
    </div>
    <div class="stat-card" style="border-left-color:var(--warning)">
      <div class="stat-label">工作回報總筆數</div>
      <div class="stat-value" id="sReport">—</div>
    </div>
  </div>

  <!-- CSV 匯出 -->
  <div class="card">
    <div class="card-header"><span class="card-title">📥 CSV 批次匯出</span></div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
      <button class="btn btn-outline" onclick="exportCSV('attendance')">📅 匯出出勤記錄</button>
      <button class="btn btn-outline" onclick="exportCSV('overtime')">⏰ 匯出加班記錄</button>
      <button class="btn btn-outline" onclick="exportCSV('leave')">🌿 匯出請假記錄</button>
    </div>
  </div>

  <!-- 工作回報列表 -->
  <div class="card">
    <div class="card-header"><span class="card-title">📝 本月工作回報</span></div>
    <div id="reportList"><div style="text-align:center;padding:20px;color:var(--text-muted)">請先載入統計</div></div>
  </div>

</main>
<div id="loading-overlay"><div class="spinner"></div></div>
<div id="toast-container"></div>
<div id="modal-overlay" onclick="UI.hideModal()"><div class="modal-box" onclick="event.stopPropagation()"><div class="modal-title" id="modal-title"></div><div class="modal-body" id="modal-body"></div><div class="modal-actions"><button class="btn btn-primary btn-sm" id="modal-confirm">確認</button><button class="btn btn-ghost btn-sm" id="modal-cancel" onclick="UI.hideModal()">取消</button></div></div></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script>
<script>
(async () => {
  const user = await AUTH.guard(['admin']); if (!user) return;
  document.getElementById('sidebarName').textContent = user.name;
  document.getElementById('sidebarAvatar').textContent = user.name.charAt(0);
  const now = new Date();
  document.getElementById('filterMonth').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  await loadStats();
})();

async function loadStats() {
  const month = document.getElementById('filterMonth').value;
  if (!month) return;
  const start = month + '-01';
  const end   = month + '-31';

  const [attR, otR, lvR, wrR] = await Promise.all([
    API.getAttendanceList({ start_date: start, end_date: end }),
    API.getOvertimeStats({}),
    API.getLeaveStats({}),
    API.getAllWorkReports({ start_date: start, end_date: end })
  ]);

  document.getElementById('sAtt').textContent   = attR.success ? attR.records.filter(r=>r.clock_in_time).length : '—';
  document.getElementById('sOT').textContent    = otR.success  ? otR.month_approved_hours : '—';
  document.getElementById('sLeave').textContent = lvR.success  ? lvR.month_approved_hours : '—';
  document.getElementById('sReport').textContent= wrR.success  ? wrR.reports.length : '—';

  if (wrR.success && wrR.reports.length) {
    document.getElementById('reportList').innerHTML = wrR.reports.slice(0,15).map(rep => `
      <div class="list-item">
        <div class="list-item-main">
          <div class="list-item-title">${rep.name} <span style="color:var(--text-muted);font-weight:400;font-size:.85rem">${rep.report_date}</span></div>
          <div class="list-item-sub" style="white-space:pre-line;max-height:40px;overflow:hidden">${rep.completed_tasks}</div>
        </div>
        <div style="flex-shrink:0;display:flex;flex-direction:column;gap:4px;align-items:flex-end">
          ${rep.issue_flag==='TRUE'?'<span class="badge" style="background:#fce8e6;color:var(--danger);border:1px solid #f5c6c3">有問題</span>':''}
          ${rep.need_assistance==='TRUE'?'<span class="badge" style="background:#fff8e1;color:#f4b400;border:1px solid #ffe082">需協助</span>':''}
        </div>
      </div>`).join('');
  } else {
    document.getElementById('reportList').innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">本月尚無工作回報</div></div>';
  }
}

async function exportCSV(type) {
  const month = document.getElementById('filterMonth').value;
  if (!month) { UI.showToast('請先選擇月份','warning'); return; }
  const start = month + '-01', end = month + '-31';
  let r, filename;
  if (type === 'attendance') { r = await API.exportAttendanceCsv({ start_date: start, end_date: end }); filename = `出勤記錄_${month}.csv`; }
  else if (type === 'overtime')  { r = await API.exportOvertimeCsv({ start_date: start, end_date: end }); filename = `加班記錄_${month}.csv`; }
  else { r = await API.exportLeaveCsv({ start_date: start, end_date: end }); filename = `請假記錄_${month}.csv`; }
  if (!r.success) { UI.showToast('匯出失敗','error'); return; }
  const blob = new Blob([r.csv], { type:'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  UI.showToast('匯出成功','success');
}

function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('show'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); }
async function doLogout() { await API.logout(); AUTH.logout(); }
</script>
</body>
</html>
