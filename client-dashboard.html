<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數發部首頁 — 派遣人員勤務管理系統</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div></div>
<div id="toast-container"></div>
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:16px">
  <div style="font-size:3rem">📋</div>
  <h1 style="font-size:1.25rem;font-weight:700;color:#1a1a2e">歡迎，<span id="uname"></span></h1>
  <p style="color:#5f6368;font-size:.9rem">系統建置中，完整功能即將上線</p>
  <div style="background:#fff;border-radius:12px;padding:20px;width:100%;max-width:360px;box-shadow:0 4px 12px rgba(0,0,0,.08)">
    <p style="font-size:.85rem;color:#5f6368;margin-bottom:12px">目前可使用：</p>
    <a href="change-password.html" style="display:block;padding:12px;background:#e8f0fe;border-radius:8px;color:#1a73e8;font-weight:500;font-size:.9rem;text-align:center">🔐 修改密碼</a>
  </div>
  <button onclick="doLogout()" style="margin-top:8px;padding:10px 24px;border:1.5px solid #dadce0;border-radius:8px;background:#fff;color:#5f6368;font-size:.9rem;cursor:pointer">登出</button>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
(async()=>{
  const user = await AUTH.guard(['client']);
  if(!user) return;
  document.getElementById('uname').textContent = user.name;
})();
async function doLogout(){
  await API.logout();
  AUTH.logout();
}
</script>
</body>
</html>
