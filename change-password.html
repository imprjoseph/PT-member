<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>修改密碼 — 派遣人員勤務管理系統</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .pw-page {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg-app); padding: 24px;
  }
  .pw-card { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 32px 24px; width: 100%; max-width: 420px; }
  .pw-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .pw-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
  .pw-subtitle { font-size: .875rem; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.6; }
  .first-notice {
    background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 20px; font-size: .85rem; color: #795548; line-height: 1.5;
  }
  .strength-bar { height: 4px; border-radius: 2px; margin-top: 8px; background: var(--border); overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 2px; width: 0; transition: width .3s, background .3s; }
  .strength-label { font-size: .75rem; color: var(--text-muted); margin-top: 4px; }
  .input-wrap { position: relative; }
  .pw-toggle-dark { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); font-size: 1rem; cursor: pointer; padding: 4px; }
</style>
</head>
<body>
<div class="pw-page">
  <div class="pw-card">
    <div class="pw-icon">🔐</div>
    <h1 class="pw-title">修改密碼</h1>
    <p class="pw-subtitle">請設定新密碼以保護您的帳號安全</p>

    <div class="first-notice" id="firstNotice" style="display:none">
      ⚠️ <strong>首次登入</strong>：為確保帳號安全，請立即設定新密碼。
    </div>

    <div class="form-group" style="margin-bottom:16px">
      <label class="form-label dark">舊密碼</label>
      <div class="input-wrap">
        <input class="form-input dark" type="password" id="oldPw" placeholder="請輸入目前密碼">
        <button class="pw-toggle-dark" type="button" onclick="toggleField('oldPw', this)">👁</button>
      </div>
      <span class="form-error" id="oldPwError"></span>
    </div>

    <div class="form-group" style="margin-bottom:16px">
      <label class="form-label dark">新密碼</label>
      <div class="input-wrap">
        <input class="form-input dark" type="password" id="newPw" placeholder="至少 8 碼，含英文與數字" oninput="checkStrength(this.value)">
        <button class="pw-toggle-dark" type="button" onclick="toggleField('newPw', this)">👁</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-label" id="strengthLabel">請輸入新密碼</div>
      <span class="form-error" id="newPwError"></span>
    </div>

    <div class="form-group" style="margin-bottom:24px">
      <label class="form-label dark">確認新密碼</label>
      <div class="input-wrap">
        <input class="form-input dark" type="password" id="confirmPw" placeholder="再輸入一次新密碼">
        <button class="pw-toggle-dark" type="button" onclick="toggleField('confirmPw', this)">👁</button>
      </div>
      <span class="form-error" id="confirmPwError"></span>
    </div>

    <button class="btn btn-primary" id="submitBtn" onclick="doChange()">確認修改</button>
    <button class="btn btn-ghost" style="margin-top:10px" id="cancelBtn" onclick="goBack()">取消</button>

    <div id="resultMsg" style="display:none;margin-top:16px;padding:12px;border-radius:8px;font-size:.875rem;text-align:center;"></div>
  </div>
</div>

<div id="loading-overlay"><div class="spinner"></div></div>
<div id="toast-container"></div>
<!-- Modal stub -->
<div id="modal-overlay" onclick="UI.hideModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-primary btn-sm" id="modal-confirm">確認</button>
      <button class="btn btn-ghost btn-sm" id="modal-cancel" onclick="UI.hideModal()">取消</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  let currentUser = null;

  (async () => {
    currentUser = await AUTH.guard(); // 所有登入者均可修改
    if (!currentUser) return;

    // 首次登入提示
    const params = new URLSearchParams(location.search);
    if (params.get('first') === '1') {
      document.getElementById('firstNotice').style.display = 'block';
      document.getElementById('cancelBtn').style.display = 'none';
    }
  })();

  function toggleField(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁' : '🙈';
  }

  function checkStrength(val) {
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { pct: '0%', bg: '#dadce0', text: '請輸入新密碼' },
      { pct: '25%', bg: '#db4437', text: '強度：弱' },
      { pct: '50%', bg: '#f4b400', text: '強度：普通' },
      { pct: '75%', bg: '#1a73e8', text: '強度：良好' },
      { pct: '100%', bg: '#0f9d58', text: '強度：強' }
    ];
    const lv = levels[val.length === 0 ? 0 : Math.min(score, 4)];
    fill.style.width = lv.pct;
    fill.style.background = lv.bg;
    label.textContent = lv.text;
    label.style.color = lv.bg;
  }

  function clearErrors() {
    ['oldPwError','newPwError','confirmPwError'].forEach(id => {
      document.getElementById(id).textContent = '';
    });
    const msg = document.getElementById('resultMsg');
    msg.style.display = 'none';
  }

  async function doChange() {
    clearErrors();
    const old = document.getElementById('oldPw').value;
    const nw  = document.getElementById('newPw').value;
    const cf  = document.getElementById('confirmPw').value;
    let valid = true;

    if (!old) { document.getElementById('oldPwError').textContent = '請輸入舊密碼'; valid = false; }
    if (!nw || nw.length < 8) { document.getElementById('newPwError').textContent = '新密碼至少 8 碼'; valid = false; }
    if (!/[A-Za-z]/.test(nw) || !/[0-9]/.test(nw)) { document.getElementById('newPwError').textContent = '需包含英文與數字'; valid = false; }
    if (nw !== cf) { document.getElementById('confirmPwError').textContent = '兩次密碼不一致'; valid = false; }
    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '修改中...';

    const result = await API.changePassword(old, nw);
    btn.disabled = false; btn.textContent = '確認修改';

    const msg = document.getElementById('resultMsg');
    if (result.success) {
      msg.style.display = 'block';
      msg.style.background = '#e6f4ea'; msg.style.color = '#0f9d58'; msg.style.border = '1px solid #c3e6cb';
      msg.textContent = '✓ 密碼修改成功！即將跳轉...';
      setTimeout(() => {
        const home = CONFIG.ROLE_HOME[currentUser.role] || 'login.html';
        window.location.href = home;
      }, 1500);
    } else {
      msg.style.display = 'block';
      msg.style.background = '#fce8e6'; msg.style.color = '#db4437'; msg.style.border = '1px solid #f5c6c3';
      msg.textContent = result.message || '修改失敗，請稍後再試';
    }
  }

  function goBack() {
    const home = currentUser ? CONFIG.ROLE_HOME[currentUser.role] : 'login.html';
    window.location.href = home || 'login.html';
  }
</script>
</body>
</html>
