<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>登入 — 派遣人員勤務管理系統</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .login-page { position: relative; overflow: hidden; }
  .login-bg-circle {
    position: absolute; border-radius: 50%;
    background: rgba(26,115,232,.05); pointer-events: none;
  }
  .circle-1 { width: 400px; height: 400px; top: -100px; right: -100px; }
  .circle-2 { width: 300px; height: 300px; bottom: -50px; left: -80px; }
  .pw-toggle {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-secondary);
    font-size: 1rem; cursor: pointer; padding: 4px;
  }
  .input-wrap { position: relative; }
</style>
</head>
<body>
<div class="login-page">
  <div class="login-shell">
    <section class="login-showcase" aria-label="系統特色">
      <img class="showcase-logo" src="impr-logo.png" alt="imPR 新動力公共關係顧問">
      <div class="showcase-content">
        <div class="showcase-eyebrow">Workforce Operations Platform</div>
        <h2 class="showcase-title">把每一次出勤，變成<span>清楚可管理</span>的營運資訊。</h2>
        <p class="showcase-copy">整合出勤、工作回報、加班與請假流程，讓派遣團隊、管理者與業主在同一個可信賴的工作空間協作。</p>
        <div class="showcase-points">
          <div class="showcase-point">
            <span class="showcase-point-icon">◎</span>
            <strong>即時出勤</strong>
            <small>快速掌握每日到勤與工時狀態</small>
          </div>
          <div class="showcase-point">
            <span class="showcase-point-icon">◇</span>
            <strong>流程整合</strong>
            <small>申請、確認與紀錄集中管理</small>
          </div>
          <div class="showcase-point">
            <span class="showcase-point-icon">✓</span>
            <strong>權限安全</strong>
            <small>依角色提供清楚且適切的功能</small>
          </div>
        </div>
      </div>
      <div class="showcase-foot">imPR · PEOPLE OPERATIONS, SIMPLIFIED</div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <div class="login-kicker">Secure workspace</div>
        <h1 class="login-title">歡迎回來</h1>
        <p class="login-subtitle">登入派遣人員勤務管理系統，繼續今天的工作。</p>

        <form class="login-form" id="loginForm" onsubmit="doLogin(event)">
          <div class="form-group">
            <label class="form-label" for="email">公司帳號</label>
            <input class="form-input" type="email" id="email" placeholder="name@company.com" autocomplete="email" required>
            <span class="form-error" id="emailError"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">密碼</label>
            <div class="input-wrap">
              <input class="form-input" type="password" id="password" placeholder="輸入您的密碼" autocomplete="current-password" required>
              <button class="pw-toggle" type="button" id="pwToggle" onclick="togglePw()" aria-label="顯示密碼">👁</button>
            </div>
            <span class="form-error" id="pwError"></span>
          </div>

          <button class="btn btn-primary" id="loginBtn" type="submit">
            <span id="loginBtnText">安全登入</span>
          </button>

          <div id="loginError" role="alert" aria-live="polite" style="display:none;background:#fce8e6;border:1px solid #f5c6c3;border-radius:8px;padding:12px;color:#b31412;font-size:.875rem;text-align:center;"></div>
        </form>

        <div class="login-security"><span>🔒</span> 連線及帳號資訊皆受安全機制保護</div>
        <div class="login-footer">
          © 2026 新動力公共關係顧問 imPR
        </div>
      </div>
    </section>
  </div>
</div>

<!-- Loading & Toast -->
<div id="loading-overlay"><div class="spinner"></div></div>
<div id="toast-container"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  // 若已登入直接跳轉
  (async () => { await AUTH.guardLoginPage(); })();

  function togglePw() {
    const inp = document.getElementById('password');
    const btn = document.getElementById('pwToggle');
    if (inp.type === 'password') {
      inp.type = 'text'; btn.textContent = '🙈'; btn.setAttribute('aria-label', '隱藏密碼');
    } else {
      inp.type = 'password'; btn.textContent = '👁'; btn.setAttribute('aria-label', '顯示密碼');
    }
  }

  async function doLogin(event) {
    if (event) event.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    if (btn.disabled) return;

    // 清除舊錯誤
    errBox.style.display = 'none';
    document.getElementById('emailError').textContent = '';
    document.getElementById('pwError').textContent = '';

    if (!email) { document.getElementById('emailError').textContent = '請輸入帳號'; return; }
    if (!password) { document.getElementById('pwError').textContent = '請輸入密碼'; return; }

    btn.disabled = true;
    document.getElementById('loginBtnText').textContent = '登入中...';

    const result = await API.login(email, password);

    btn.disabled = false;
    document.getElementById('loginBtnText').textContent = '安全登入';

    if (!result.success) {
      errBox.style.display = 'block';
      errBox.textContent = result.message || '登入失敗，請稍後再試';
      return;
    }

    // 儲存 session
    AUTH.setSession(result.token, result.user);

    // 需要強制改密碼
    if (result.force_change_password) {
      window.location.href = 'change-password.html?first=1';
      return;
    }

    // 依角色跳轉
    const home = CONFIG.ROLE_HOME[result.user.role] || 'login.html';
    window.location.href = home;
  }
</script>
</body>
</html>
